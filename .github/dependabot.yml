# Generated by the setup-dependabot skill ( https://github.com/bannzai/castle ) and now maintained by hand,
# because the @types/node ignore rule below is not something the skill generates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # @types/node follows the Node.js major version that Fusen supports (22, see engines),
    # so a newer major would type-check APIs that Node.js 22 does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
